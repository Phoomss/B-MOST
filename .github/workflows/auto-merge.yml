name: Auto Merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - develop
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    name: Auto Squash Merge to develop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process Auto Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH_EVENT: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR_NUMBER=""

          # -------------------------------------------------------------
          # 1. Identify PR Number from trigger event
          # -------------------------------------------------------------
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_NUMBER="$PR_NUMBER_EVENT"
            echo "Triggered by pull_request event for PR #$PR_NUMBER"

          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "Triggered by workflow_run event (CI conclusion: $WORKFLOW_CONCLUSION)"

            # If CI failed or was cancelled, NEVER merge
            if [ "$WORKFLOW_CONCLUSION" != "success" ]; then
              echo "CI checks failed or incomplete ($WORKFLOW_CONCLUSION). Auto merge is BLOCKED."
              exit 0
            fi

            HEAD_BRANCH="$HEAD_BRANCH_EVENT"
            echo "CI passed for branch: $HEAD_BRANCH"

            # Skip CI runs directly on base branches
            if [ "$HEAD_BRANCH" = "develop" ] || [ "$HEAD_BRANCH" = "main" ]; then
              echo "Branch $HEAD_BRANCH is a base branch. Skipping auto merge."
              exit 0
            fi

            # Locate open PR targeting develop from this head branch
            PR_NUMBER=$(gh pr list \
              --repo "$REPO" \
              --head "$HEAD_BRANCH" \
              --base develop \
              --state open \
              --json number \
              --jq '.[0].number')
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open Pull Request found targeting 'develop'. Nothing to merge."
            exit 0
          fi

          echo "Inspecting Pull Request #$PR_NUMBER..."

          # -------------------------------------------------------------
          # 2. Inspect PR Details and Validate Constraints
          # -------------------------------------------------------------
          PR_JSON=$(gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json baseRefName,headRefName,isDraft,mergeable,state)

          BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.baseRefName')
          SOURCE_BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName')
          IS_DRAFT=$(echo "$PR_JSON" | jq -r '.isDraft')
          MERGEABLE=$(echo "$PR_JSON" | jq -r '.mergeable')
          PR_STATE=$(echo "$PR_JSON" | jq -r '.state')

          echo "- Target (Base) Branch: $BASE_BRANCH"
          echo "- Source (Head) Branch: $SOURCE_BRANCH"
          echo "- State: $PR_STATE"
          echo "- Is Draft: $IS_DRAFT"
          echo "- Mergeable: $MERGEABLE"

          # Condition: PR must be open
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is already $PR_STATE. Skipping."
            exit 0
          fi

          # Condition: Target branch must be develop
          if [ "$BASE_BRANCH" != "develop" ]; then
            echo "Target branch is '$BASE_BRANCH' (not develop). Skipping auto merge."
            exit 0
          fi

          # Condition: PR must NOT be a draft
          if [ "$IS_DRAFT" = "true" ]; then
            echo "PR #$PR_NUMBER is a Draft. Skipping auto merge until marked ready for review."
            exit 0
          fi

          # Condition: No merge conflicts
          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "PR #$PR_NUMBER has merge conflicts. Auto merge cannot proceed."
            exit 1
          fi

          # -------------------------------------------------------------
          # 3. Strategy A: Enable GitHub Native Auto-Merge (if configured)
          # IMPORTANT: We DO NOT pass --delete-branch. Source branch is preserved.
          # -------------------------------------------------------------
          echo "Attempting to enable GitHub native auto-merge with squash..."
          if gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash; then
            echo "Successfully enabled native auto-merge for PR #$PR_NUMBER using Squash and merge."
            echo "Source branch '$SOURCE_BRANCH' will remain intact after merge."
            exit 0
          fi

          echo "Native auto-merge could not be configured directly. Checking if direct squash merge can be performed..."

          # -------------------------------------------------------------
          # 4. Strategy B: Direct Squash Merge (when CI has completed successfully)
          # IMPORTANT: We DO NOT pass --delete-branch. Source branch is preserved.
          # -------------------------------------------------------------
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$WORKFLOW_CONCLUSION" = "success" ]; then
            if [ "$MERGEABLE" = "MERGEABLE" ]; then
              echo "CI checks passed and PR is mergeable. Executing Squash and Merge for PR #$PR_NUMBER..."
              gh pr merge "$PR_NUMBER" \
                --repo "$REPO" \
                --squash \
                --subject "$SOURCE_BRANCH (#$PR_NUMBER)"

              echo "Squash and Merge successfully executed for PR #$PR_NUMBER into 'develop'!"
              echo "Source branch '$SOURCE_BRANCH' is preserved and remains available in repository."
            else
              echo "PR #$PR_NUMBER mergeable status is '$MERGEABLE'. Waiting for GitHub check/merge state resolution."
            fi
          else
            echo "Auto-merge will be triggered once CI workflow completes successfully."
          fi
