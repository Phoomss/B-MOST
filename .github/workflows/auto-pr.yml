name: Auto Pull Request

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    name: Create Pull Request to develop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Existing PR and Create if Not Present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Checking whether a Pull Request from branch '$BRANCH_NAME' to 'develop' already exists..."
          EXISTING_PR=$(gh pr list \
            --repo "$REPO" \
            --head "$BRANCH_NAME" \
            --base develop \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "An open Pull Request (#$EXISTING_PR) already exists for '$BRANCH_NAME' -> 'develop'."
            echo "Skipping PR creation to avoid duplicate Pull Requests."
            exit 0
          fi

          echo "No open Pull Request found. Creating automated Pull Request..."
          PR_BODY=$(printf "### 🤖 Automated Pull Request\n\nThis Pull Request was automatically generated by GitHub Actions.\n\n- **Source Branch:** \`%s\`\n- **Target Branch:** \`develop\`\n- **Triggered By Commit:** \`%s\`\n- **Author:** \`@%s\`\n\n---\n*Workflow: \`.github/workflows/auto-pr.yml\`*" "$BRANCH_NAME" "$COMMIT_SHA" "$ACTOR")

          PR_URL=$(gh pr create \
            --repo "$REPO" \
            --head "$BRANCH_NAME" \
            --base develop \
            --title "$BRANCH_NAME" \
            --body "$PR_BODY")

          echo "Automated Pull Request created successfully: $PR_URL"
